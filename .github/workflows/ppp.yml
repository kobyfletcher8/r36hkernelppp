name: Build R36S Kernel - Wired Ethernet USB (No Wireless)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build R36S Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      - name: Clone R36S kernel
        run: |
          set -e
          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git \
            kernel

      - name: Restore missing exFAT driver
        working-directory: kernel
        run: |
          set -e

          if [ ! -f fs/exfat/Kconfig ]; then
            echo "fs/exfat is missing; restoring compatible exFAT driver."

            rm -rf /tmp/linux-exfat-oot

            git clone \
              --depth=1 \
              --single-branch \
              --branch for-kernel-version-from-4.1.0 \
              https://github.com/namjaejeon/linux-exfat-oot.git \
              /tmp/linux-exfat-oot

            mkdir -p fs/exfat
            cp -a /tmp/linux-exfat-oot/. fs/exfat/
            rm -rf fs/exfat/.git
          fi

          test -f fs/exfat/Kconfig
          test -f fs/exfat/Makefile

      - name: Load R36S defconfig
        working-directory: kernel
        run: |
          set -e
          make ARCH=arm64 lineageos_r36s_defconfig

      - name: Disable all wireless and Wi-Fi drivers
        working-directory: kernel
        run: |
          set -e

          : > no-wireless.config

          if [ -d drivers/net/wireless ]; then
            find drivers/net/wireless \
              -type f \
              \( -name 'Kconfig' -o -name 'Kconfig.*' \) \
              -print0 |
            while IFS= read -r -d '' kconfig; do
              grep -hE \
                '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
                "$kconfig" || true
            done |
            sed -E \
              's/^[[:space:]]*config[[:space:]]+//' |
            sed -E \
              's/[[:space:]].*$//' |
            sort -u |
            while IFS= read -r symbol; do
              [ -n "$symbol" ] || continue
              printf 'CONFIG_%s=n\n' "$symbol"
            done >> no-wireless.config
          fi

          cat >> no-wireless.config <<'EOF'
          CONFIG_WIRELESS=n
          CONFIG_WLAN=n
          CONFIG_CFG80211=n
          CONFIG_MAC80211=n
          CONFIG_USB_NET_RNDIS_WLAN=n
          CONFIG_WIFI_LOAD_DRIVER_WHEN_KERNEL_BOOTUP=n
          EOF

          sort -u no-wireless.config -o no-wireless.config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            no-wireless.config

          make ARCH=arm64 olddefconfig

      - name: Enable wired Ethernet and USB drivers
        working-directory: kernel
        run: |
          set -e

          : > wired-usb.config

          # Intentionally excludes drivers/net/wireless and all Wi-Fi
          # vendor trees. Only wired Ethernet MAC drivers, USB drivers,
          # and USB Ethernet/network drivers are included here.
          for dir in \
            drivers/net/ethernet \
            drivers/net/usb \
            drivers/usb
          do
            [ -d "$dir" ] || continue

            find "$dir" \
              -type f \
              \( -name 'Kconfig' -o -name 'Kconfig.*' \) \
              -print0 |
            while IFS= read -r -d '' kconfig; do
              grep -hE \
                '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
                "$kconfig" || true
            done |
            sed -E \
              's/^[[:space:]]*config[[:space:]]+//' |
            sed -E \
              's/[[:space:]].*$//' |
            sort -u |
            while IFS= read -r symbol; do
              [ -n "$symbol" ] || continue
              printf 'CONFIG_%s=y\n' "$symbol"
            done >> wired-usb.config
          done

          # Core wired networking.
          cat >> wired-usb.config <<'EOF'
          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_OF_NET=y
          CONFIG_OF_MDIO=y
          CONFIG_MDIO_DEVICE=y
          CONFIG_MDIO_BUS=y
          CONFIG_PHYLIB=y

          # USB core.
          CONFIG_USB_SUPPORT=y
          CONFIG_USB=y

          # USB networking.
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_EEM=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_RNDIS_HOST=y
          CONFIG_USB_NET_CDC_SUBSET=y

          # PPP / PPTP.
          CONFIG_PPP=y
          CONFIG_PPP_BSDCOMP=y
          CONFIG_PPP_DEFLATE=y
          CONFIG_PPP_FILTER=y
          CONFIG_PPP_MPPE=y
          CONFIG_PPP_MULTILINK=y
          CONFIG_PPPOE=y
          CONFIG_PPTP=y
          CONFIG_PPPOL2TP=y
          CONFIG_PPP_ASYNC=y
          CONFIG_PPP_SYNC_TTY=y

          # exFAT.
          CONFIG_EXFAT_FS=y
          CONFIG_EXFAT_DEFAULT_IOCHARSET="utf8"
          EOF

          # Never allow a wireless symbol to be re-enabled by the broad
          # Ethernet/USB sweep.
          if [ -f no-wireless.config ]; then
            while IFS= read -r line; do
              case "$line" in
                CONFIG_*=n)
                  symbol="${line%%=n}"
                  sed -i "/^${symbol}=y$/d" wired-usb.config
                  sed -i "/^${symbol}=m$/d" wired-usb.config
                  ;;
              esac
            done < no-wireless.config
          fi

          sort -u wired-usb.config -o wired-usb.config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            wired-usb.config

          make ARCH=arm64 olddefconfig

      - name: Re-disable wireless after dependency resolution
        working-directory: kernel
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            no-wireless.config

          make ARCH=arm64 olddefconfig

      - name: Verify no wireless drivers are enabled
        working-directory: kernel
        run: |
          set -e

          failed=0

          echo "Checking wireless configuration..."

          for symbol in \
            CONFIG_WIRELESS \
            CONFIG_WLAN \
            CONFIG_CFG80211 \
            CONFIG_MAC80211 \
            CONFIG_USB_NET_RNDIS_WLAN \
            CONFIG_WIFI_LOAD_DRIVER_WHEN_KERNEL_BOOTUP
          do
            if grep -qx "${symbol}=y" .config || \
               grep -qx "${symbol}=m" .config; then
              echo "WIRELESS ENABLED: ${symbol}"
              failed=1
            else
              echo "OK: ${symbol} disabled"
            fi
          done

          if [ -d drivers/net/wireless ]; then
            while IFS= read -r symbol; do
              [ -n "$symbol" ] || continue

              if grep -qx "CONFIG_${symbol}=y" .config || \
                 grep -qx "CONFIG_${symbol}=m" .config; then
                echo "WIRELESS DRIVER ENABLED: CONFIG_${symbol}"
                failed=1
              fi
            done < <(
              find drivers/net/wireless \
                -type f \
                \( -name 'Kconfig' -o -name 'Kconfig.*' \) \
                -print0 |
              while IFS= read -r -d '' kconfig; do
                grep -hE \
                  '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
                  "$kconfig" || true
              done |
              sed -E \
                's/^[[:space:]]*config[[:space:]]+//' |
              sed -E \
                's/[[:space:]].*$//' |
              sort -u
            )
          fi

          if [ "$failed" -ne 0 ]; then
            echo
            echo "ERROR: at least one wireless/Wi-Fi option is enabled."
            exit 1
          fi

          echo
          echo "All wireless/Wi-Fi drivers are disabled."

      - name: Verify required wired networking options
        working-directory: kernel
        run: |
          set -e

          required=(
            CONFIG_NET
            CONFIG_NETDEVICES
            CONFIG_ETHERNET
            CONFIG_USB_SUPPORT
            CONFIG_USB
            CONFIG_USB_NET_DRIVERS
            CONFIG_USB_USBNET
            CONFIG_PPP
            CONFIG_PPP_BSDCOMP
            CONFIG_PPP_DEFLATE
            CONFIG_PPP_FILTER
            CONFIG_PPP_MPPE
            CONFIG_PPP_MULTILINK
            CONFIG_PPPOE
            CONFIG_PPTP
            CONFIG_PPPOL2TP
            CONFIG_PPP_ASYNC
            CONFIG_PPP_SYNC_TTY
            CONFIG_EXFAT_FS
          )

          failed=0

          for symbol in "${required[@]}"; do
            if grep -qx "${symbol}=y" .config; then
              echo "OK      ${symbol}=y"
            else
              echo "MISSING ${symbol}=y"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "One or more required options were disabled by Kconfig."
            exit 1
          fi

      - name: Show final important configuration
        working-directory: kernel
        run: |
          echo "========================================"
          echo "WIRED ETHERNET / USB / PPP"
          echo "========================================"

          grep -E \
            '^CONFIG_(NET|NETDEVICES|ETHERNET|MDIO|PHY|USB_NET|USB_USBNET|PPP|PPPOE|PPTP|PPPOL2TP)' \
            .config || true

          echo
          echo "========================================"
          echo "WIRELESS"
          echo "========================================"

          grep -E \
            '^CONFIG_(WIRELESS|WLAN|CFG80211|MAC80211|USB_NET_RNDIS_WLAN|WIFI_LOAD_DRIVER_WHEN_KERNEL_BOOTUP)=' \
            .config || true

          echo
          echo "========================================"
          echo "EXFAT"
          echo "========================================"

          grep -E '^CONFIG_EXFAT_' .config || true

      - name: Build ARM64 kernel Image
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Package kernel
        run: |
          set -e

          mkdir -p output

          cp kernel/arch/arm64/boot/Image \
            output/Image

          cp kernel/.config \
            output/r36s.config

          cp kernel/wired-usb.config \
            output/wired-usb.config

          cp kernel/no-wireless.config \
            output/no-wireless.config

          cd output

          zip -9 \
            ../r36s-kernel-wired-ethernet-usb.zip \
            Image \
            r36s.config \
            wired-usb.config \
            no-wireless.config

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r36s-kernel-wired-ethernet-usb
          path: |
            output/Image
            output/r36s.config
            output/wired-usb.config
            output/no-wireless.config
            r36s-kernel-wired-ethernet-usb.zip
          if-no-files-found: error
