name: Build R36S Kernel - All Network USB Drivers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build R36S Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      - name: Clone R36S kernel
        run: |
          set -e
          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git \
            kernel

      - name: Restore missing exFAT driver
        working-directory: kernel
        run: |
          set -e

          # The R36S kernel's fs/Kconfig and fs/Makefile reference
          # fs/exfat, but the directory is missing from the repository.
          #
          # Use the exFAT backport branch intended for older kernels.
          if [ ! -f fs/exfat/Kconfig ]; then
            echo "fs/exfat is missing; restoring a 4.1-5.15 compatible exFAT driver."

            rm -rf /tmp/linux-exfat-oot
            git clone \
              --depth=1 \
              --single-branch \
              --branch for-kernel-version-from-4.1.0 \
              https://github.com/namjaejeon/linux-exfat-oot.git \
              /tmp/linux-exfat-oot

            mkdir -p fs/exfat
            cp -a /tmp/linux-exfat-oot/. fs/exfat/

            rm -rf fs/exfat/.git
          fi

          test -f fs/exfat/Kconfig
          test -f fs/exfat/Makefile

          echo "exFAT driver restored successfully."

      - name: Load R36S defconfig
        working-directory: kernel
        run: |
          set -e
          make ARCH=arm64 lineageos_r36s_defconfig

      - name: Create all network and USB driver configuration
        working-directory: kernel
        run: |
          set -e

          : > all-network-usb.config

          for dir in \
            drivers/net \
            drivers/usb
          do
            [ -d "$dir" ] || continue

            find "$dir" \
              -type f \
              \( -name 'Kconfig' -o -name 'Kconfig.*' \) \
              -print0 |
            while IFS= read -r -d '' kconfig; do
              grep -hE \
                '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
                "$kconfig" || true
            done |
            sed -E \
              's/^[[:space:]]*config[[:space:]]+//' |
            sed -E \
              's/[[:space:]].*$//' |
            sort -u |
            while IFS= read -r symbol; do
              [ -n "$symbol" ] || continue
              printf 'CONFIG_%s=y\n' "$symbol"
            done >> all-network-usb.config
          done

          cat >> all-network-usb.config <<'EOF'

          # Core networking
          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_WIRELESS=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_OF_NET=y
          CONFIG_OF_MDIO=y
          CONFIG_MDIO_DEVICE=y
          CONFIG_MDIO_BUS=y
          CONFIG_PHYLINK=y
          CONFIG_PHYLIB=y

          # USB core
          CONFIG_USB_SUPPORT=y
          CONFIG_USB=y
          CONFIG_USB_COMMON=y
          CONFIG_USB_PHY=y
          CONFIG_USB_GADGET=y

          # USB networking
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_EEM=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_RNDIS_HOST=y
          CONFIG_USB_NET_CDC_SUBSET_ENABLE=y
          CONFIG_USB_NET_CDC_SUBSET=y
          CONFIG_USB_NET_RNDIS_WLAN=y

          # PPP / PPTP
          CONFIG_PPP=y
          CONFIG_PPP_BSDCOMP=y
          CONFIG_PPP_DEFLATE=y
          CONFIG_PPP_FILTER=y
          CONFIG_PPP_MPPE=y
          CONFIG_PPP_MULTILINK=y
          CONFIG_PPPOE=y
          CONFIG_PPTP=y
          CONFIG_PPPOL2TP=y
          CONFIG_PPP_ASYNC=y
          CONFIG_PPP_SYNC_TTY=y

          # exFAT
          CONFIG_EXFAT_FS=y
          CONFIG_EXFAT_DEFAULT_IOCHARSET="utf8"
          EOF

          sort -u \
            all-network-usb.config \
            -o all-network-usb.config

          echo "Generated $(wc -l < all-network-usb.config) configuration entries."

      - name: Merge network and USB configuration
        working-directory: kernel
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            all-network-usb.config

          make ARCH=arm64 olddefconfig

      - name: Display final configuration
        working-directory: kernel
        run: |
          echo "========================================"
          echo "NETWORK / ETHERNET / WIFI / PPP"
          echo "========================================"

          grep -E \
            '^CONFIG_(NET|NETDEVICES|ETHERNET|MDIO|PHY|WIRELESS|WLAN|CFG80211|MAC80211|PPP|PPPOE|PPTP|PPPOL2TP|USB_NET|USB_USBNET)' \
            .config || true

          echo
          echo "========================================"
          echo "USB"
          echo "========================================"

          grep -E '^CONFIG_USB_' .config || true

          echo
          echo "========================================"
          echo "EXFAT"
          echo "========================================"

          grep -E '^CONFIG_EXFAT_' .config || true

      - name: Verify required options
        working-directory: kernel
        run: |
          set -e

          required=(
            CONFIG_NET
            CONFIG_NETDEVICES
            CONFIG_ETHERNET
            CONFIG_WIRELESS
            CONFIG_WLAN
            CONFIG_CFG80211
            CONFIG_MAC80211
            CONFIG_USB_SUPPORT
            CONFIG_USB
            CONFIG_USB_NET_DRIVERS
            CONFIG_USB_USBNET
            CONFIG_PPP
            CONFIG_PPP_BSDCOMP
            CONFIG_PPP_DEFLATE
            CONFIG_PPP_FILTER
            CONFIG_PPP_MPPE
            CONFIG_PPP_MULTILINK
            CONFIG_PPPOE
            CONFIG_PPTP
            CONFIG_PPPOL2TP
            CONFIG_PPP_ASYNC
            CONFIG_PPP_SYNC_TTY
            CONFIG_EXFAT_FS
          )

          failed=0

          for symbol in "${required[@]}"; do
            if grep -qx "${symbol}=y" .config; then
              echo "OK      ${symbol}=y"
            else
              echo "MISSING ${symbol}=y"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "One or more required options could not be enabled"
            echo "after Kconfig dependency resolution."
            exit 1
          fi

      - name: Build ARM64 kernel Image
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Package kernel
        run: |
          set -e

          mkdir -p output

          cp kernel/arch/arm64/boot/Image \
            output/Image

          cp kernel/.config \
            output/r36s.config

          cp kernel/all-network-usb.config \
            output/all-network-usb.config

          cd output

          zip -9 \
            ../r36s-kernel-all-network-usb.zip \
            Image \
            r36s.config \
            all-network-usb.config

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r36s-kernel-all-network-usb
          path: |
            output/Image
            output/r36s.config
            output/all-network-usb.config
            r36s-kernel-all-network-usb.zip
          if-no-files-found: error
